name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (local Spark + Delta, no workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYSPARK_PYTHON: python
      # conftest.py resolves the Delta jar from this mirror first (Maven Central can return 429).
      SPARK_JARS_REPOSITORIES: https://maven-central.storage-download.googleapis.com/maven2,https://repo1.maven.org/maven2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            databricks/pyproject.toml
            tools/pc2dbx/**/pyproject.toml
            tools/pc2dbx/**/requirements*.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Ivy (Delta jars)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('databricks/pyproject.toml') }}
          restore-keys: ivy-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e 'databricks[dev]'
          if [ -f tools/pc2dbx/pyproject.toml ]; then pip install -e tools/pc2dbx; fi
          if [ -f tools/pc2dbx/requirements.txt ]; then pip install -r tools/pc2dbx/requirements.txt; fi

      - name: pytest databricks
        run: pytest databricks -ra

      - name: pytest tools/pc2dbx
        if: hashFiles('tools/pc2dbx/**/*.py') != ''
        run: pytest tools/pc2dbx -ra
